name: Deploy BOT Chain Testnet

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: botchain-testnet-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract tests
        run: pnpm contract:test

      - name: Deploy and verify contract
        id: deploy
        run: pnpm contract:deploy:testnet
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}

      - name: Store contract address in source
        run: pnpm contract:set-address "${{ steps.deploy.outputs.contract_address }}"

      - name: Commit deployed address
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/chain.ts
          git commit -m "chore: configure BOT Chain testnet contract"
          git push
